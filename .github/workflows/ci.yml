name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试 (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: npm run check
      - name: 单元与集成测试（离线，不依赖 codely/LLM）
        run: npm test
